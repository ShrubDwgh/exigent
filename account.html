<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Akun · Emergency Card</title>
</head>
<body class="dash acct">
  <header class="appbar">
    <div class="appbar-in">
      <div class="appbar-lead" id="appbar-lead"></div>
      <button class="icon-btn" id="bell" type="button" aria-label="Notifikasi" aria-haspopup="dialog"><i data-lucide="bell" aria-hidden="true"></i><span class="dot" id="bell-dot" hidden></span></button>
    </div>
  </header>

  <aside class="side">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card</div>
    <nav aria-label="Menu utama">
      <a class="nav-btn" href="/dashboard.html"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span data-nav-label="dashboard">Dashboard</span></a>
      <a class="nav-btn" href="/medical-search.html"><i data-lucide="map-pin" aria-hidden="true"></i><span data-nav-label="medical">Medis</span></a>
      <a class="nav-btn active" href="/account.html" aria-current="page"><i data-lucide="user" aria-hidden="true"></i><span data-nav-label="account">Akun</span></a>
    </nav>
  </aside>

  <main class="main" id="acct-main" tabindex="-1">
    <!-- Skeleton: Greeting -->
    <div style="padding-bottom:16px;border-bottom:1px solid #e5e7eb;margin-bottom:16px">
      <div class="skeleton-line" style="height:22px;width:70%;margin-bottom:8px"></div>
      <div class="skeleton-line" style="width:80%;height:12px;margin:0"></div>
    </div>

    <!-- Skeleton: Menu list (7 item) -->
    <div class="skeleton-card" style="padding:0;overflow:hidden">
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:50%;margin:0"></div></div>
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:45%;margin:0"></div></div>
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:55%;margin:0"></div></div>
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:50%;margin:0"></div></div>
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:40%;margin:0"></div></div>
      <div style="padding:18px 20px;border-bottom:1px solid #f3f4f6"><div class="skeleton-line" style="width:60%;margin:0"></div></div>
      <div style="padding:18px 20px"><div class="skeleton-line" style="width:50%;margin:0"></div></div>
    </div>
  </main>

  <script type="module" src="/account.js"></script>
</body>
</html>
