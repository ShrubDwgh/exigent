<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <!-- PWA -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <title>Dashboard · Emergency Card</title>
</head>
<body class="dash">
  <div class="topbar" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <span style="display:inline-flex;align-items:center;gap:8px;min-width:0">
      <i data-lucide="heart-pulse" aria-hidden="true"></i>
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Emergency Card</span>
    </span>
    <button type="button" onclick="location.href='/shop.html'" aria-label="Buka Toko" style="
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 12px;
      border-radius:8px;
      border:1px solid #e5e7eb;
      background:#f9fafb;
      color:#111827;
      font-size:13px;
      font-weight:600;
      font-family:inherit;
      cursor:pointer;
      flex-shrink:0;
      white-space:nowrap;
      transition:background .15s;
    ">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      Toko
    </button>
  </div>
  <aside class="side">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card</div>
    <nav aria-label="Menu utama">
      <a class="nav-btn active" href="/dashboard.html" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span data-nav-label="dashboard">Dashboard</span></a>
      <a class="nav-btn" href="/medical-search.html"><i data-lucide="map-pin" aria-hidden="true"></i><span data-nav-label="medical">Medis</span></a>
      <a class="nav-btn" href="/account.html"><i data-lucide="user" aria-hidden="true"></i><span data-nav-label="account">Akun</span></a>
    </nav>
  </aside>
  <main class="main">
    <section id="tab-dashboard">
      <!-- Skeleton: Card Status -->
      <div class="skeleton-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="skeleton-line w35" style="margin:0"></div>
          <div class="skeleton-line w20" style="margin:0"></div>
        </div>
        <div class="skeleton-line w25" style="margin-bottom:6px"></div>
        <div class="skeleton-line" style="height:22px;width:60%;margin-bottom:16px"></div>
        <div class="skeleton-line w25" style="margin-bottom:6px"></div>
        <div class="skeleton-line w90" style="margin-bottom:16px"></div>
        <div style="display:flex;gap:8px">
          <div class="skeleton-btn" style="width:100px;margin:0"></div>
          <div class="skeleton-btn" style="width:100px;margin:0;background:#f3f4f6"></div>
        </div>
      </div>

      <!-- Skeleton: QR Code -->
      <div class="skeleton-card" style="margin-top:12px">
        <div class="skeleton-line w30" style="margin-bottom:16px"></div>
        <div style="width:180px;height:180px;background:#e5e7eb;border-radius:12px;margin:0"></div>
        <div class="skeleton-btn" style="margin-top:16px"></div>
      </div>
    </section>
  </main>
  <button class="fab" id="fab-edit" type="button" aria-label="Edit Data Medis"><i data-lucide="plus" aria-hidden="true"></i></button>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
