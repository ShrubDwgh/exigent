<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <title>Dashboard · Emergency Card</title>
</head>
<body class="dash">
  <div class="topbar"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card</div>
  <aside class="side">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card</div>
    <nav aria-label="Menu utama">
      <button class="nav-btn active" data-tab="dashboard"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Dashboard</span></button>
      <a class="nav-btn" href="/medical-search.html"><i data-lucide="map-pin" aria-hidden="true"></i><span>Medis</span></a>
      <button class="nav-btn" data-tab="profil"><i data-lucide="user" aria-hidden="true"></i><span>Profil</span></button>
    </nav>
  </aside>
  <main class="main">
    <section id="tab-dashboard">
      <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
      <div class="skeleton-card"><div class="skeleton-line w90"></div><div class="skeleton-btn"></div></div>
    </section>
    <section id="tab-profil" hidden></section>
  </main>
  <button class="fab" id="fab-edit" type="button" aria-label="Edit Data Medis"><i data-lucide="plus" aria-hidden="true"></i></button>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
