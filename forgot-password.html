<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Lupa Password · Emergency Card</title>
</head>
<body>
  <main class="wrap auth">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card NFC</div>
    <div class="card">
      <h1>Lupa Password?</h1>
      <p class="muted" style="margin-top:8px">Masukkan email kamu. Kami akan kirim link untuk reset password.</p>
      <form id="form" novalidate style="margin-top:20px">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" required>
        </div>
        <p id="msg" class="msg" role="alert" hidden></p>
        <button class="btn btn-block" type="submit">Kirim Link Reset</button>
      </form>
      <p class="muted center" style="margin-top:16px">
        <a href="/login.html">← Kembali ke Login</a>
      </p>
    </div>
  </main>
  <script type="module" src="/forgot-password.js"></script>
</body>
</html>
