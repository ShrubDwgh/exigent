<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Masuk · Emergency Card</title>
</head>
<body>
  <main class="wrap auth">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card NFC</div>
    <div class="card">
      <h1>Masuk ke Emergency Card</h1>
      
      <form id="form" data-mode="login" novalidate style="margin-top:20px">
        <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
        <p id="msg" class="msg" role="alert" hidden></p>
        <button class="btn btn-block" type="submit">Masuk</button>
      </form>

      <!-- === TOMBOL LOGIN GOOGLE DITAMBAHKAN DI SINI === -->
      <div style="text-align: center; margin-top: 20px;">
        <p style="color: #888; font-size: 14px; margin-bottom: 10px;">Atau</p>
        <button type="button" onclick="loginWithGoogle()" style="background: white; color: #333; border: 1px solid #ccc; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold;">
          <img src="https://www.google.com/favicon.ico" width="18" alt="Google">
          Masuk dengan Google
        </button>
      </div>
      <!-- ============================================== -->

      <p class="muted center">Belum punya akun? <a href="/register.html">Daftar</a></p>
    </div>
  </main>
  <script type="module" src="/auth-page.js"></script>
</body>
</html>
