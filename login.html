<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <!-- PWA -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Masuk · Emergency Card</title>
</head>
<body>
  <main class="wrap auth">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card NFC</div>
    <div class="card">
      <h1 data-i18n="login_title">Masuk ke Emergency Card</h1>
      
      <form id="form" data-mode="login" novalidate style="margin-top:20px">
        <div class="field"><label for="email" data-i18n="login_email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password" data-i18n="login_password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
        <p style="text-align:right;margin-top:-8px;margin-bottom:12px">
          <a href="/forgot-password.html" style="font-size:13px;color:#2563eb;text-decoration:none" data-i18n="login_forgot">Lupa password?</a>
        </p>
        <p id="msg" class="msg" role="alert" hidden></p>
        <button class="btn btn-block" type="submit" data-i18n="login_btn">Masuk</button>
      </form>

      <!-- === TOMBOL LOGIN GOOGLE === -->
      <div style="text-align: center; margin-top: 20px;">
        <p style="color: #888; font-size: 14px; margin-bottom: 10px;" data-i18n="login_or">Atau</p>
        <button type="button" onclick="loginWithGoogle()" style="background: white; color: #333; border: 1px solid #ccc; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold;">
          <img src="https://www.google.com/favicon.ico" width="18" alt="Google">
          <span data-i18n="login_google">Masuk dengan Google</span>
        </button>
      </div>

      <p class="muted center"><span data-i18n="login_no_acc">Belum punya akun?</span> <a href="/register.html" data-i18n="login_register_link">Daftar</a></p>
    </div>
  </main>
  <script type="module" src="/auth-page.js"></script>
  <script type="module" src="/i18n-boot.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
