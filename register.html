<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <!-- PWA -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Daftar · Emergency Card</title>
</head>
<body>
  <main class="wrap auth">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card NFC</div>
    <div class="card">
      <h1 data-i18n="reg_title">Buat akun Emergency Card</h1>
      <form id="form" data-mode="register" novalidate style="margin-top:20px">
        <div class="field"><label for="email" data-i18n="reg_email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password" data-i18n="reg_password">Password</label><input class="input" id="password" type="password" autocomplete="new-password" required></div>
        <p id="msg" class="msg" role="alert" hidden></p>
        <button class="btn btn-block" type="submit" data-i18n="reg_btn">Daftar</button>
      </form>
      <p class="muted center"><span data-i18n="reg_has_acc">Sudah punya akun?</span> <a href="/login.html" data-i18n="reg_login_link">Masuk</a></p>
    </div>
  </main>
  <script type="module" src="/auth-page.js"></script>
  <script type="module" src="/i18n-boot.js"></script>
</body>
</html>
