<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <!-- PWA -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <title>Reset Password · Emergency Card</title>
</head>
<body>
  <main class="wrap auth">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card NFC</div>
    <div class="card">
      <h1>Reset Password</h1>
      <p class="muted" style="margin-top:8px">Masukkan password baru untuk akun kamu.</p>
      <form id="form" novalidate style="margin-top:20px">
        <div class="field">
          <label for="password">Password Baru</label>
          <input class="input" id="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="password2">Konfirmasi Password Baru</label>
          <input class="input" id="password2" type="password" autocomplete="new-password" required>
        </div>
        <p id="msg" class="msg" role="alert" hidden></p>
        <button class="btn btn-block" type="submit">Simpan Password Baru</button>
      </form>
      <p class="muted center" style="margin-top:16px">
        <a href="/login.html">← Kembali ke Login</a>
      </p>
    </div>
  </main>
  <script type="module" src="/reset-password.js"></script>
</body>
</html>
