<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="robots" content="noindex, nofollow">
  <title>Pengaturan · Emergency Card</title>
  <!-- Halaman ini sudah pindah ke Halaman Akun. File dibiarkan agar tautan/bookmark lama tetap jalan. -->
  <script>location.replace('/account.html#/settings');</script>
  <noscript><meta http-equiv="refresh" content="0;url=/account.html#/settings"></noscript>
</head>
<body>
  <p><a href="/account.html#/settings">Buka Pengaturan</a></p>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
