<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
  (function(){
    try {
      var t = localStorage.getItem('exigent_theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
  </script>
  <meta name="theme-color" content="#DC2626">
  <meta name="robots" content="noindex, nofollow">
  <!-- PWA -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Exigent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

</head>
<body class="dash acct">
  <header class="appbar">
    <div class="appbar-in">

    </div>
  </header>

  <aside class="side">
    <div class="brand"><i data-lucide="heart-pulse" aria-hidden="true"></i>Emergency Card</div>
    <nav aria-label="Menu utama">

      <div class="skeleton-line" style="width:60%;margin:0"></div>
    </div>
    <div class="skeleton-line" style="height:42px;border-radius:10px;margin:0 0 16px"></div>

      <div class="skeleton-btn" style="width:84px;height:33px;border-radius:20px;margin:0"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:12px">
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:12px">
        <div class="skeleton-line" style="height:200px;border-radius:12px;margin:0"></div>
        <div>

          <div class="skeleton-line" style="height:12px;margin:0 0 7.5px"></div>

          <div class="skeleton-line" style="height:22.5px;width:90px;margin:0"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="skeleton-line" style="height:22px;width:110px;margin:0"></div>
          <div class="skeleton-btn" style="width:84px;height:44px;margin:0"></div>
        </div>
      </div>
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:12px">
        <div class="skeleton-line" style="height:200px;border-radius:12px;margin:0"></div>
        <div>
          <div class="skeleton-line" style="height:15px;width:65%;margin:0 0 10.5px"></div>
          <div class="skeleton-line" style="height:12px;margin:0 0 7.5px"></div>

          <div class="skeleton-line" style="height:22.5px;width:90px;margin:0"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="skeleton-line" style="height:22px;width:110px;margin:0"></div>
          <div class="skeleton-btn" style="width:84px;height:44px;margin:0"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/shop.js"></script>
</body>
</html>
